<text x="20" y="30" font-size="20" font-weight="600" fill="#17202a">Car harness - who connects to whom</text>
<text x="20" y="50" fill="#5b6875">Wire sizes in mm2; lengths are estimates [E]. Colours: red 12 V battery, purple protected 12 V, black ground, yellow/green CAN, brown car signals, blue logic.</text>
