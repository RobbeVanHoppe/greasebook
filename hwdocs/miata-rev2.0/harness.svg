<g fill="#17202a" font-weight="600">
<text x="30" y="104">Battery +</text><text x="30" y="214">Chassis ground</text><text x="30" y="314">Ignition switch taps</text>
<text x="30" y="464">ME221 ECU</text><text x="310" y="100">2DIN opening (tombstone)</text><text x="330" y="130">Power module #1</text>
<text x="520" y="130">Dash PCB</text><text x="710" y="130">Pi 3B + carrier</text><text x="710" y="270">LCD 1024x600</text>
<text x="520" y="320">Haptic knob</text><text x="330" y="290">Chassis star</text><text x="940" y="100">Driver-side under-dash</text>
<text x="960" y="130">Power module #2</text><text x="960" y="250">Main PCB</text><text x="960" y="464">Relay box</text>
<text x="310" y="484">Stalk / reverse switch</text></g>
<g fill="#5b6875" font-size="12">
<text x="30" y="122">permanent 12 V, 7.5 A fuse</text><text x="30" y="138">at the source</text>
<text x="30" y="334">IG1 (BLK/YEL) RUN+START</text><text x="30" y="352">ACC (BLU/BLK) drops in START</text><text x="30" y="370">1 A inline fuse at each tap</text>
<text x="30" y="484">pin 21 CAN-H, pin 51 CAN-L</text>
<text x="330" y="148">J1 in, J2 knob, J3 main</text><text x="330" y="164">J4 Pi 5 V, J5 logic</text><text x="330" y="180">fuse 5 A</text>
<text x="520" y="148">ESP32: supervisor + knob</text><text x="520" y="164">CAN junction (no 120 ohm)</text><text x="520" y="180">RJ45 to main</text>
<text x="710" y="148">carrier: 5 V + handshake</text><text x="710" y="164">MCP2518FD HAT, term. OFF</text>
<text x="520" y="338">SimpleFOC Mini + 2204</text><text x="520" y="354">AS5600, push switch</text>
<text x="960" y="148">fuse 2 A, RT2 = bridge</text><text x="960" y="164">J3 = relay coil feed</text>
<text x="960" y="268">ESP32: relays, inputs</text><text x="960" y="284">GPS + IMU -> CAN</text><text x="960" y="300">CAN 120 ohm (end 2)</text>
<text x="960" y="482">RLY1 latching (HEAD)</text><text x="960" y="498">RLY2-4 ISO mini changeover</text><text x="960" y="514">1 A fuse per coil feed</text>
<text x="310" y="502">HEAD line, reverse switch</text></g>
